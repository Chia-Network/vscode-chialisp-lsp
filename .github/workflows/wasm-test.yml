name: Wasm Test

on:
  push:
    branches:
      - "main"
      - "dev"
      - "base"

  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set Job Env
        uses: Chia-Network/actions/setjobenv@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@stable
        with:
            target: wasm32-unknown-unknown
            components: rustfmt
      - name: Install wasm-pack
        run: |
          cargo install wasm-pack
      - name: Run tests
        run: |
          cd wasm && cargo test

  arm-gdb-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set Job Env
        uses: Chia-Network/actions/setjobenv@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@stable
        with:
            target: wasm32-unknown-unknown
      - name: Install gdb-multiarch
        run: sudo apt-get update && sudo apt-get install -y gdb-multiarch
      - name: Install wasm-pack
        run: cargo install --version 0.13.1 wasm-pack
      - name: Build optimized wasm
        run: cd wasm && wasm-pack build --release --target nodejs
      - name: ARM GDB breakpoint step and inspect
        run: node scripts/arm-gdb/smoke_test.js
