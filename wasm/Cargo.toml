[package]
name = "clvm_tools_lsp"
version = "1.2.4"
edition = "2018"
authors = ["Art Yerkes <art.yerkes@gmail.com>"]
description = "tools for working with chialisp language; compiler, repl, python and wasm bindings"
homepage = "https://chialisp.com/"
readme = "README.md"
repository = "https://github.com/Chia-Network/chialisp"
license = "MIT"
keywords = ["chia", "chialisp", "clvm"]
categories = ["command-line-utilities"]

[lib]
name = "clvm_tools_lsp"
crate-type = ["cdylib"]
path = "src/mod.rs"

[dependencies]
chialisp = "0.4.4"
clvmr = "0.16.0"
# Pinned to the NOP-anchor revision this extension was written against.
# clvm_arm_jit v0.1.0 changes Program::new and CallbackGdbStub::new and drops
# synthetic source from ElfObject, so a newer revision is not a drop-in.
clvm_to_arm_chialisp = { git = "https://github.com/prozacchiwawa/clvm_arm_jit.git", rev = "eb397028ec00d4604a508eb8eac64a12d6cb07b7" }
clvm_to_arm_emulate = { git = "https://github.com/prozacchiwawa/clvm_arm_jit.git", rev = "eb397028ec00d4604a508eb8eac64a12d6cb07b7" }
clvm_to_arm_generate = { git = "https://github.com/prozacchiwawa/clvm_arm_jit.git", rev = "eb397028ec00d4604a508eb8eac64a12d6cb07b7" }
wasm-bindgen = "=0.2.100"
wasm-bindgen-test = "=0.3.50"
js-sys = "0.3.77"
serde_json = "1.0"
serde = "1.0.142"
lsp-server = "0.6.0"
lsp-types = "0.93.0"
lazy_static = "1.4.0"
regex = "1.12.3"
url = "2.3.1"
percent-encoding = "2.2.0"
indoc = "1.0"
debug_types = "1.0.0"
getrandom = "0.2.9"

[dev-dependencies]
gimli = "0.28.1"
